version: '3.8'

services:
  # ==========================================
  # (Reverse Proxy) - Nginx
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: production_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # (Backend) - Flask
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production_api
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=flask_user
      - DB_PASSWORD=${FLASK_DB_PASSWORD:-SuperSecretPass123}
      - DB_NAME=flask_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # (Database) - MySQL
  # ==========================================
  db:
    image: mysql:8.4
    container_name: production_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootCriticalPass}
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: ${FLASK_DB_PASSWORD:-SuperSecretPass123}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootCriticalPass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==========================================
# (Network Topology)
# ==========================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true 

# ==========================================
# (State Persistence)
# ==========================================
volumes:
  mysql_data:
