[project]
name = "flask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Z-ajamy", email = "abdorahman0283@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
]

[project.scripts]
flask = "flask:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle Error: Catches invalid syntax and spacing violations.
    "F",   # Pyflakes: Catches fatal logical bugs and undefined variables.
    "I",   # isort: Automatically sorts and groups all imports cleanly.
    "UP",  # pyupgrade: Forces legacy code to use modern Python features.
    "B",   # flake8-bugbear: Detects common architectural design flaws.
]

ignore = [
    "B008",
]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.mypy]
python_executable = ".venv/bin/python"
strict = true
